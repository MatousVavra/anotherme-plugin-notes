<div class="vault-layout" x-data="notesPlugin()">
    <aside class="vault-panel">
        <div class="vault-search-wrap">
            <input
                type="text"
                class="vault-search"
                x-model="search"
                placeholder="Search notes..."
                @input="searchVault()"
            >
        </div>
        <div class="filter-chips vault-filters">
            <button class="filter-chip" :class="{ active: filter === 'All' }" @click="filter = 'All'; searchVault()">All</button>
            <button class="filter-chip" :class="{ active: filter === 'Diary' }" @click="filter = 'Diary'; searchVault()">Diary</button>
            <button class="filter-chip" :class="{ active: filter === 'Stories' }" @click="filter = 'Stories'; searchVault()">Stories</button>
            <button class="filter-chip" :class="{ active: filter === 'People' }" @click="filter = 'People'; searchVault()">People</button>
            <button class="filter-chip" :class="{ active: filter === 'Projects' }" @click="filter = 'Projects'; searchVault()">Projects</button>
            <button class="filter-chip" :class="{ active: filter === 'Notes' }" @click="filter = 'Notes'; searchVault()">Notes</button>
        </div>
        <div class="vault-view-toggle">
            <button class="view-toggle-btn" :class="{ active: viewMode === 'grid' }" @click="switchView('grid')">Grid</button>
            <button class="view-toggle-btn" :class="{ active: viewMode === 'tree' }" @click="switchView('tree')">Tree</button>
            <button class="view-toggle-btn" :class="{ active: viewMode === 'graph' }" @click="switchView('graph')">Graph</button>
        </div>
    </aside>

    <div class="vault-content">
        <template x-if="selectedNote">
            <div class="note-viewer">
                <button class="note-back-btn" @click="closeNote()">&#8592; Back</button>
                <div class="note-rendered" x-html="AM.utils.renderMarkdown(noteContent)"></div>
            </div>
        </template>

        <template x-if="!selectedNote && viewMode === 'grid'">
            <div class="notes-grid">
                <template x-if="filteredNotes().length === 0">
                    <div class="memory-empty">No notes found</div>
                </template>
                <template x-for="note in filteredNotes()" :key="note.path">
                    <button class="note-card" @click="openNote(note)">
                        <div class="note-card-name" x-text="note.filename"></div>
                        <div class="note-card-path" x-text="note.path"></div>
                        <div class="note-card-meta">
                            <span class="note-card-folder" x-text="note.folder"></span>
                            <span class="note-card-date" x-text="AM.utils.formatDate(note.modified)"></span>
                        </div>
                    </button>
                </template>
            </div>
        </template>

        <template x-if="!selectedNote && viewMode === 'tree'">
            <div class="vault-tree-container">
                <template x-if="treeData.length === 0">
                    <div class="memory-empty">No folders found</div>
                </template>
                <template x-for="folder in treeData" :key="folder.name">
                    <div class="tree-folder">
                        <div class="tree-folder-header" @click="toggleFolder(folder.name)">
                            <span class="tree-folder-arrow" x-text="expandedFolders[folder.name] ? '\u25BE' : '\u25B8'"></span>
                            <span class="tree-folder-name" x-text="folder.name"></span>
                            <span class="tree-folder-count" x-text="'(' + folder.children.length + ')'"></span>
                        </div>
                        <template x-if="expandedFolders[folder.name]">
                            <div class="tree-folder-children">
                                <template x-for="file in folder.children" :key="file.path">
                                    <button class="tree-file" @click="openNote({ path: file.path })">
                                        <span x-text="file.name"></span>
                                    </button>
                                </template>
                            </div>
                        </template>
                    </div>
                </template>
            </div>
        </template>

        <template x-if="!selectedNote && viewMode === 'graph'">
            <div class="vault-graph-container">
                <template x-if="graphData.nodes.length === 0">
                    <div class="graph-empty">No notes to graph</div>
                </template>
                <div id="notes-graph-network"></div>
            </div>
        </template>
    </div>

    <button class="vault-mobile-filter-btn" @click="mobileFilterOpen = true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="14" y2="12"/><line x1="4" y1="18" x2="8" y2="18"/></svg>
        <span x-text="filter"></span>
    </button>

    <div class="mobile-vault-sheet" x-show="mobileFilterOpen" @click.self="mobileFilterOpen = false" x-cloak x-transition>
        <div class="mobile-vault-sheet-panel">
            <div class="mobile-vault-sheet-header">
                <span>Filter & Search</span>
                <button @click="mobileFilterOpen = false">Done</button>
            </div>
            <input type="text" class="vault-search" x-model="search" placeholder="Search notes..." @input="searchVault()">
            <div class="filter-chips vault-filters" style="flex-direction: column;">
                <button class="filter-chip" :class="{ active: filter === 'All' }" @click="filter = 'All'; searchVault()">All</button>
                <button class="filter-chip" :class="{ active: filter === 'Diary' }" @click="filter = 'Diary'; searchVault()">Diary</button>
                <button class="filter-chip" :class="{ active: filter === 'Stories' }" @click="filter = 'Stories'; searchVault()">Stories</button>
                <button class="filter-chip" :class="{ active: filter === 'People' }" @click="filter = 'People'; searchVault()">People</button>
                <button class="filter-chip" :class="{ active: filter === 'Projects' }" @click="filter = 'Projects'; searchVault()">Projects</button>
                <button class="filter-chip" :class="{ active: filter === 'Notes' }" @click="filter = 'Notes'; searchVault()">Notes</button>
            </div>
            <div class="vault-view-toggle">
                <button class="view-toggle-btn" :class="{ active: viewMode === 'grid' }" @click="switchView('grid')">Grid</button>
                <button class="view-toggle-btn" :class="{ active: viewMode === 'tree' }" @click="switchView('tree')">Tree</button>
                <button class="view-toggle-btn" :class="{ active: viewMode === 'graph' }" @click="switchView('graph')">Graph</button>
            </div>
        </div>
    </div>
</div>
